services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: nightplan
      POSTGRES_USER: nightplan
      POSTGRES_PASSWORD: nightplan
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://nightplan:nightplan@postgres:5432/nightplan
    ports:
      - "8000:8000"
    depends_on: [postgres]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
volumes:
  pgdata:
