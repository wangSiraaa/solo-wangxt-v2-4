[project]
name = "nightplan"
version = "0.1.0"
description = "天文台观测提案 -> 夜间可执行计划 排程服务"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "astropy>=6.0",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
